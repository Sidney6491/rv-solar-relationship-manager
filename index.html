<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relationship Manager — RV Solar Hub</title>
<style>
  :root{
    --brand:#2d5016; --brand-deep:#1f380f; --brand-mid:#4a7328;
    --panel:#e2edd6; --panel-line:#cddbb8;
    --bg:#eef2e7; --card:#ffffff;
    --ink:#243018; --muted:#5f6b57; --soft:#7c8874; --line:#dbe2d2;
    --accent:#c8820a; --accent-ink:#b06f08; --accent-soft:#f6e3c2;
    --danger:#b23c3c; --danger-soft:#f7e2e2;
    --radius:14px;
    --shadow:0 1px 2px rgba(45,80,22,.05),0 4px 16px rgba(45,80,22,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45;}
  .app{max-width:920px;margin:0 auto;padding:24px 20px 70px;}
  button{font-family:inherit;}

  /* ---------- header ---------- */
  header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    border-bottom:3px solid var(--accent);padding-bottom:14px;margin-bottom:24px;}
  .brand{display:flex;align-items:center;gap:12px;margin-right:auto;}
  .logo{height:40px;width:auto;border-radius:8px;display:block;}
  .brand h1{font-size:19px;margin:0;font-weight:800;color:var(--brand);letter-spacing:-.01em;}
  .brand p{margin:0;font-size:12px;color:var(--soft);font-weight:600;}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:9px 13px;
    font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
  .btn:hover{background:#f4f7ef;}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;}
  .btn.primary:hover{background:var(--brand-deep);border-color:var(--brand-deep);}
  .btn.ghost{border-color:transparent;color:var(--muted);}
  .btn.ghost:hover{background:#e6ecdd;}
  .btn.danger{color:var(--danger);border-color:#e8c9c9;}
  .btn.danger:hover{background:#fbf1f1;}

  /* ---------- zones ---------- */
  .zone{background:var(--panel);border:1px solid var(--panel-line);border-radius:18px;
    padding:18px 20px 20px;margin-bottom:18px;box-shadow:0 6px 20px rgba(45,80,22,.05);}
  .zhead{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;}
  .zhead h2{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--brand);font-weight:800;}
  .zcount{font-size:12px;color:var(--muted);font-weight:600;}

  .item{background:var(--card);border:1px solid var(--panel-line);border-left:4px solid var(--brand-mid);
    border-radius:12px;padding:14px 16px;display:flex;gap:13px;align-items:flex-start;
    box-shadow:0 2px 8px rgba(45,80,22,.05);margin-bottom:10px;}
  .item:last-child{margin-bottom:0;}
  .item.personal{border-left-color:var(--accent);}
  .item.late{border-color:#dcb4b4;border-left-color:var(--danger);background:linear-gradient(180deg,#fdf7f6,#fff);}
  .ibody{flex:1;min-width:0;}
  .iline{font-size:15.5px;font-weight:700;line-height:1.35;color:var(--ink);}
  .isub{font-size:13px;color:var(--muted);margin-top:3px;}
  .isub .late{color:var(--danger);font-weight:700;}
  .isub .due{color:var(--accent-ink);font-weight:700;}
  .inum{color:var(--brand);font-weight:700;white-space:nowrap;}
  .iact{display:flex;gap:7px;align-items:center;margin-top:11px;flex-wrap:wrap;}
  .iact select{border:1px solid var(--line);border-radius:8px;padding:6px 7px;font:inherit;font-size:12px;background:#fff;}
  .idone{border:1px solid var(--brand);background:#fff;color:var(--brand);border-radius:8px;padding:6px 12px;
    font-size:12.5px;cursor:pointer;font-weight:700;}
  .idone:hover{background:var(--brand);color:#fff;}
  .imail{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:8px;padding:6px 11px;
    font-size:12.5px;cursor:pointer;font-weight:600;text-decoration:none;display:inline-block;line-height:1.45;}
  .imail:hover{background:var(--accent-soft);border-color:#e2c893;color:var(--accent-ink);}
  .icopy{border:1px solid var(--line);background:#fff;color:var(--soft);border-radius:8px;padding:6px 10px;
    font-size:12.5px;cursor:pointer;font-weight:600;line-height:1.45;margin-left:-2px;}
  .icopy:hover{background:var(--accent-soft);border-color:#e2c893;color:var(--accent-ink);}
  .isnooze{border:1px solid transparent;background:none;color:var(--soft);border-radius:8px;
    padding:6px 10px;font-size:12.5px;cursor:pointer;font-weight:600;}
  .isnooze:hover{background:#eef2e7;color:var(--muted);}
  .iopen{border:none;background:none;color:var(--muted);font-size:12.5px;cursor:pointer;font-weight:600;
    text-decoration:underline;text-underline-offset:2px;padding:6px 2px;}
  .iopen:hover{color:var(--brand);}
  .zempty{background:#fff;border:1px dashed var(--panel-line);border-radius:12px;padding:22px;
    text-align:center;color:var(--muted);font-size:14px;}
  .zempty b{display:block;color:var(--brand);font-size:15.5px;font-weight:800;margin-bottom:3px;}

  /* ---------- avatars ---------- */
  .av{border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;
    font-weight:700;flex:0 0 auto;letter-spacing:.02em;}
  .av.s{width:34px;height:34px;font-size:12.5px;}
  .av.m{width:38px;height:38px;font-size:13.5px;}
  .av.l{width:54px;height:54px;font-size:19px;}

  /* ---------- rolodex ---------- */
  .rolo{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px 8px;box-shadow:var(--shadow);}
  .rhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:13px;}
  .rhead h2{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--brand);font-weight:800;margin-right:auto;}
  .rsearch{position:relative;flex:1;min-width:200px;max-width:320px;}
  .rsearch input{width:100%;padding:9px 12px 9px 32px;border:1px solid var(--line);border-radius:9px;
    background:#fff;font-size:14px;outline:none;font-family:inherit;}
  .rsearch input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .rsearch .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--soft);
    display:flex;align-items:center;pointer-events:none;}

  .rail{display:flex;flex-wrap:wrap;gap:3px;padding:11px 0 13px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  .rail button{border:none;background:none;color:var(--brand);font-weight:800;font-size:12px;
    width:24px;height:24px;border-radius:6px;cursor:pointer;padding:0;}
  .rail button:hover{background:var(--panel);}
  .rail button.on{background:var(--brand);color:#fff;}
  .rail button.off{color:#c2cbb8;cursor:default;}
  .rail button.off:hover{background:none;}
  .rail button.all{width:auto;padding:0 9px;}

  .rlist{padding:4px 0 10px;}
  .row{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:10px;cursor:pointer;
    border-bottom:1px solid #f0f4ea;}
  .row:last-child{border-bottom:none;}
  .row:hover{background:#f4f7ef;}
  .rname{font-weight:700;color:var(--brand);font-size:14.5px;line-height:1.2;}
  .rco{color:var(--soft);font-size:12.5px;font-weight:500;}
  .rmeta{margin-left:auto;text-align:right;white-space:nowrap;}
  .rwhen{color:var(--soft);font-size:11.5px;margin-top:3px;}
  .rnone{padding:24px;text-align:center;color:var(--muted);}
  .pill{display:inline-flex;font-size:.6rem;letter-spacing:.4px;text-transform:uppercase;
    padding:3px 9px;border-radius:999px;font-weight:800;}
  .pill.biz{background:#eaf3e0;color:var(--brand);}
  .pill.per{background:var(--accent-soft);color:var(--accent-ink);}
  .pill.fam{background:#f2ddc0;color:#96590a;}

  /* ---------- modals ---------- */
  .overlay{display:none;position:fixed;inset:0;background:rgba(31,56,15,.45);z-index:50;
    align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;}
  .overlay.open{display:flex;}
  .modal{background:#fff;border-radius:18px;width:100%;max-width:480px;box-shadow:0 20px 60px rgba(31,56,15,.35);}
  .modal.wide{max-width:540px;}
  .mtitle{margin:0;padding:16px 20px;font-size:15px;font-weight:800;color:var(--brand);border-bottom:1px solid var(--line);}
  .mbody{padding:18px 20px;display:flex;flex-direction:column;gap:14px;max-height:64vh;overflow:auto;}
  .mfoot{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .mfoot .right{display:flex;gap:8px;margin-left:auto;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:700;}
  .field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:9px;
    padding:9px 11px;font-size:14px;font-family:inherit;outline:none;background:#fff;}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .field textarea{min-height:76px;resize:vertical;}
  .field .hint{font-size:11.5px;color:var(--soft);margin-top:4px;}
  .addfield{border:none;background:none;color:var(--accent-ink);font-size:12.5px;cursor:pointer;font-weight:700;}

  /* detail view */
  .dhead{display:flex;gap:14px;align-items:center;}
  .dname{font-size:20px;font-weight:800;color:var(--brand);line-height:1.15;}
  .dco{color:var(--soft);font-size:13.5px;font-weight:600;}
  .dfacts{display:flex;flex-direction:column;gap:7px;background:#f4f7ef;border-radius:11px;padding:12px 14px;}
  .dfact{display:flex;gap:8px;font-size:13.5px;}
  .dfact .k{color:var(--soft);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;
    min-width:112px;padding-top:2px;}
  .dfact a{color:var(--brand);font-weight:700;text-decoration:none;border-bottom:1px solid var(--panel-line);}
  .dfact a:hover{border-bottom-color:var(--brand);}
  .dnote{white-space:pre-wrap;background:#f4f7ef;border-left:3px solid var(--panel-line);border-radius:9px;
    padding:11px 13px;font-size:13.5px;color:#3a3f36;}
  .dopen{background:var(--panel);border:1px solid var(--panel-line);border-radius:11px;padding:12px 14px;}
  .dopen .l{font-weight:700;font-size:14px;}
  .dopen .s{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .dsec{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--soft);font-weight:800;}
  .hist{display:flex;flex-direction:column;gap:0;}
  .hrow{display:flex;gap:11px;padding:8px 0;border-bottom:1px solid #f0f4ea;font-size:13px;}
  .hrow:last-child{border-bottom:none;}
  .hd{color:var(--brand);font-weight:700;white-space:nowrap;min-width:78px;}
  .hn{color:var(--muted);}
  .hempty{color:var(--soft);font-size:13px;font-style:italic;}

  /* ---------- login ---------- */
  #login{position:fixed;inset:0;background:linear-gradient(180deg,var(--panel),var(--bg));
    display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .logincard{background:#fff;border:1px solid var(--line);border-top:4px solid var(--brand);border-radius:18px;
    box-shadow:0 12px 40px rgba(45,80,22,.14);max-width:390px;width:100%;padding:34px 30px;text-align:center;}
  .loginlogo{height:56px;width:auto;margin:0 auto 14px;display:block;}
  .logincard h1{font-size:20px;margin:0 0 3px;color:var(--brand);font-weight:800;}
  .loginsub{color:var(--soft);font-size:12.5px;font-weight:600;margin-bottom:14px;}
  .logincard p{color:var(--muted);font-size:13.5px;margin:0 0 20px;}
  #gbtn{display:flex;justify-content:center;min-height:44px;}
  .gfallback{border:1px solid var(--brand);color:var(--brand);border-radius:10px;padding:11px;font-size:14px;
    font-weight:700;cursor:pointer;background:#fff;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;}
  .gfallback:hover{background:var(--brand);color:#fff;}
  .emaildisabled,.logininfo{color:#8a9683;}
  .emaildisabled{margin-top:15px;font-size:12px;}
  .logininfo{margin-top:14px;font-size:11.5px;line-height:1.55;}
  .denied{color:var(--danger);font-size:13px;margin-top:14px;display:none;}

  .srow{display:flex;gap:8px;flex-wrap:wrap;}
  .bkbar{margin-top:14px;text-align:center;font-size:12px;color:var(--soft);}
  .bkbar.stale{color:var(--accent-ink);font-weight:600;}
  .bkbar .bklink{border:none;background:none;font:inherit;color:var(--brand);font-weight:700;
    cursor:pointer;text-decoration:underline;text-underline-offset:2px;padding:0 2px;}

  @media(max-width:560px){
    .app{padding:16px 13px 60px;}
    .zone,.rolo{padding:15px 14px;}
    .rmeta{display:none;}
  }
</style>
</head>

<script>
  /* ==========================================================================
     DATA LAYER
     ========================================================================== */
  const DATA_KEY="rvsolarhub_crm_contacts", SCHEMA_KEY="rvsolarhub_crm_schema",
        EMAIL_KEY="rvsolarhub_crm_myemail", NUDGE_KEY="rvsolarhub_crm_defaultnudge";
  const DEFAULT_COLS=["first_name","last_name","company","bucket","circle","email","phone","address",
                      "birthday","anniversary","anniversary_label","notes"];
  const LOOP_COLS=["last_contacted","follow_up_on","ball_is_with","open_loop","channel","nudge_days",
                   "history","bday_done","anniv_done","snooze_until"];
  const HIDDEN_COLS=["history","bday_done","anniv_done","snooze_until"];   // machine-kept, never a form field
  const SEND_ENDPOINT="";

  const SEED=[
    {first_name:"Bluetti",last_name:"",company:"affiliate manager",bucket:"Business",email:"snowning@bluetti.com",birthday:"",
     notes:"Bluetti affiliate manager. Impact account attached & approved 2026-07-27 (partner RV Solar Hub, account ID 7505845). Contact for B1210 / AC180 link issues."},
    {first_name:"EcoFlow",last_name:"",company:"affiliate team",bucket:"Business",email:"affiliate@ecoflow.com",birthday:"",
     notes:"EcoFlow affiliate team. Applied via Impact 2026-07-27. Program runs on Awin/direct — separate from Impact. Monetizes Article 7: Delta 2 + River 2 Pro."},
    {first_name:"Jackery",last_name:"",company:"marketing / affiliate",bucket:"Business",email:"marketing@jackery.com",birthday:"",
     notes:"Jackery affiliate contact (fallback hello@jackery.com). Runs on Impact. Monetizes Article 7: Explorer 1000 v2."},
    {first_name:"Renogy",last_name:"",company:"via Impact · affiliate program",bucket:"Business",email:"",birthday:"",
     notes:"Primary affiliate program via Impact (partner 7505845). 6% base, drops to 3% on Sep 30 2026; 9% only on RV solar KITS with code RNG6GF."}
  ];

  function loadSchema(){const r=localStorage.getItem(SCHEMA_KEY);if(r){try{return JSON.parse(r);}catch(e){}}return DEFAULT_COLS.concat(LOOP_COLS);}
  function loadData(){const r=localStorage.getItem(DATA_KEY);if(r){try{return JSON.parse(r);}catch(e){}}return SEED.slice();}
  function save(){localStorage.setItem(DATA_KEY,JSON.stringify(data));localStorage.setItem(SCHEMA_KEY,JSON.stringify(cols));}
  let cols=loadSchema(), data=loadData(), query="", railLetter="";

  function defaultNudge(){const v=parseInt(localStorage.getItem(NUDGE_KEY),10);return (v>0&&v<3650)?v:60;}
  function setDefaultNudge(v){localStorage.setItem(NUDGE_KEY,String(v));}

  function toColName(raw){return raw.trim().toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"");}
  function pretty(c){
    if(c==="open_loop")return "What's outstanding?";
    if(c==="nudge_days")return "Nudge me if we haven't spoken in\u2026 (days)";
    if(c==="channel")return "Best way to reach them";
    if(c==="circle")return "Family or friend?";
    if(c==="anniversary")return "Another date worth remembering";
    if(c==="anniversary_label")return "What kind of date is it?";
    if(c==="address")return "Mailing address";
    if(c==="phone")return "Phone";
    if(c==="ball_is_with")return "Whose move is it?";
    if(c==="bucket")return "Personal or business?";
    return c.replace(/_/g," ").replace(/\b\w/g,ch=>ch.toUpperCase());
  }

  /* ---- migrations: run once, never lose anything ---- */
  (function migrate(){
    let ch=false;
    DEFAULT_COLS.concat(LOOP_COLS).forEach(c=>{if(!cols.includes(c)){cols.push(c);ch=true;}});
    data.forEach(r=>{
      // company used to live inside last_name as "(via Impact)"
      if(r.company===undefined){r.company="";ch=true;}
      const m=String(r.last_name||"").trim().match(/^\((.+)\)$/);
      if(m&&!r.company){r.company=m[1].trim();r.last_name="";ch=true;}
      // everything that already existed was a brand/partner — start it in Business
      if(!r.bucket){r.bucket="Business";ch=true;}
      if(r.circle===undefined){r.circle="";ch=true;}
      if(!Array.isArray(r.history)){r.history=[];ch=true;}
      DEFAULT_COLS.forEach(c=>{if(r[c]===undefined){r[c]="";ch=true;}});
      LOOP_COLS.forEach(c=>{if(r[c]===undefined&&c!=="history"){r[c]="";ch=true;}});
      ["last_contacted","follow_up_on"].forEach(c=>{const n=normDate(r[c]);if(n!==r[c]){r[c]=n;ch=true;}});
    });
    if(ch)save();
  })();

  /* ==========================================================================
     DATE HELPERS
     ========================================================================== */
  function normDate(v){
    const m=String(v||"").trim().match(/^(\d{4})\D+(\d{1,3})\D+(\d{1,3})$/);if(!m)return v||"";
    const mo=+m[2],dy=+m[3];if(mo<1||mo>12||dy<1||dy>31)return v||"";
    return m[1]+"-"+String(mo).padStart(2,"0")+"-"+String(dy).padStart(2,"0");
  }
  function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
  function addDaysISO(n){const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
  function daysUntil(iso){
    if(!iso)return null;
    const m=String(iso).trim().match(/^(\d{4})\D+(\d{1,3})\D+(\d{1,3})$/);if(!m)return null;
    const mo=+m[2],dy=+m[3];if(mo<1||mo>12||dy<1||dy>31)return null;
    const t=new Date(+m[1],mo-1,dy);t.setHours(0,0,0,0);
    const n=new Date();n.setHours(0,0,0,0);
    return Math.round((t-n)/86400000);
  }
  function daysSince(iso){const d=daysUntil(iso);return d===null?null:-d;}
  const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function birthdayInfo(b){
    if(!b)return null;const p=String(b).trim().split(/[-/.]/).map(x=>x.trim()).filter(Boolean);
    let y=null,m,d;if(p.length===3){y=+p[0];m=+p[1];d=+p[2];}else if(p.length===2){m=+p[0];d=+p[1];}else return null;
    if(!m||!d||m<1||m>12||d<1||d>31)return null;
    const now=new Date();now.setHours(0,0,0,0);let nx=new Date(now.getFullYear(),m-1,d);if(nx<now)nx=new Date(now.getFullYear()+1,m-1,d);
    const days=Math.round((nx-now)/86400000);let age=null;if(y&&y>1900)age=nx.getFullYear()-y;
    return {daysAway:days,age:age};
  }
  // Same yearly recurrence as a birthday. markYear stamps which occurrence was dealt with,
  // so ticking it off in December doesn't silence next year's.
  function anniversaryInfo(r){
    const i=birthdayInfo(r.anniversary);
    if(!i)return null;
    const now=new Date();
    return {daysAway:i.daysAway, years:i.age,
            markYear:String(now.getFullYear()+(i.daysAway>200?1:0))};
  }
  function fmtBirthday(b){
    if(!b)return "";const p=String(b).trim().split(/[-/.]/).map(x=>+x);
    let y=null,m,d;if(p.length===3){y=p[0];m=p[1];d=p[2];}else if(p.length===2){m=p[0];d=p[1];}else return b;
    if(!m||!d||m<1||m>12)return b;return MON[m-1]+" "+d+(y?(", "+y):"");
  }
  function fmtDate(iso){
    const m=String(iso||"").match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return iso||"";
    return MON[+m[2]-1]+" "+(+m[3])+", "+m[1];
  }
  // "3 days" / "2 weeks" / "5 months" / "2 years" — plain speech, never a raw number of days
  function spanWords(n){
    n=Math.abs(Math.round(n));
    if(n===0)return "today";
    if(n===1)return "1 day";
    if(n<14)return n+" days";
    if(n<60){const w=Math.round(n/7);return w+" week"+(w===1?"":"s");}
    if(n<365){const mo=Math.round(n/30);return mo+" month"+(mo===1?"":"s");}
    const y=Math.floor(n/365),rem=Math.round((n%365)/30);
    return y+" year"+(y===1?"":"s")+(rem>=2?" "+rem+" months":"");
  }

  // "today" / "yesterday" / "3 days ago" — never "today ago"
  function agoWords(n){
    n=Math.round(n);
    if(n<=0)return "today";
    if(n===1)return "yesterday";
    return spanWords(n)+" ago";
  }

  /* ==========================================================================
     NAMES & AVATARS
     ========================================================================== */
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}
  function displayName(r){return ((r.first_name||"")+" "+(r.last_name||"")).trim()||"(no name)";}
  function firstName(r){return (r.first_name||"").trim()||displayName(r);}
  function initials(r){
    const w=((r.first_name||"")+" "+(r.last_name||"")).split(/\s+/).map(x=>x.replace(/[^A-Za-z0-9]/g,"")).filter(Boolean);
    let s="";
    if(w.length>=2)s=w[0][0]+w[1][0];
    else if(w.length===1)s=w[0].slice(0,2);
    if(!s)s=(String(r.email||"").match(/[A-Za-z0-9]/)||["?"])[0];
    return s.toUpperCase();
  }
  function avatarColor(r){
    let h=0;const s=displayName(r)+(r.email||"");
    for(let i=0;i<s.length;i++)h=s.charCodeAt(i)+((h<<5)-h);
    const P=["#2d5016","#4a7328","#6b8f3f","#c8820a","#8a5310","#3f6b3a"];
    return P[Math.abs(h)%P.length];
  }
  function pillCls(r){return !isPersonal(r)?"biz":(r.circle==="Family"?"per fam":"per");}
  function avatar(r,size){return '<div class="av '+size+'" style="background:'+avatarColor(r)+'">'+esc(initials(r))+'</div>';}
  function isPersonal(r){return (r.bucket||"Business")==="Personal";}
  // Personal splits into Family / Friend when Dan has said which. Same pill, better word.
  function groupWord(r){
    if(!isPersonal(r))return "Business";
    return r.circle||"Personal";
  }

  /* ==========================================================================
     THE ENGINE — turns records into sentences a person would say
     ========================================================================== */
  // How Dan reaches this person. Drives the wording, the button, and what the history logs.
  const CHANNELS={
    Call :{personal:n=>"Worth giving "+n+" a call.",
           business:n=>"Worth a call to "+n+" to see where things stand.",
           btn:"Called them", log:"Phone call"},
    Text :{personal:n=>"Drop "+n+" a text.",
           business:n=>"A text to "+n+" would do it.",
           btn:"Texted them", log:"Text"},
    Email:{personal:n=>"Worth dropping "+n+" an email.",
           business:n=>"Worth an email to "+n+" to see where things stand.",
           btn:"Emailed them", log:"Email"},
    ""   :{personal:n=>"Worth a phone call or a quick email to "+n+".",
           business:n=>"Worth an email to "+n+" to see where things stand.",
           btn:"Reached out", log:"Reached out"}
  };
  function chan(r){return CHANNELS[r.channel]||CHANNELS[""];}

  function nudgeFor(r){const v=parseInt(r.nudge_days,10);return (v>0&&v<3650)?v:defaultNudge();}

  function loopPhrase(r){
    // what the outstanding thing is, as a sentence fragment
    const t=String(r.open_loop||"").trim();
    if(!t)return "";
    return t.replace(/[.!?]+$/,"");
  }

  // Words that mean someone typed a status heading, not a sentence fragment.
  // "Waiting on confirmation" can't follow "hasn't come back to you about…".
  const LOOP_HEADINGS=/^(waiting|awaiting|pending|need|needs|needed|sent|asked|ask|follow|followup|checking|check|confirm|confirmation|reply|replied|response|responded|tbd|open|outstanding|status|update|updates|question|questions|info|information|none|n\/a)\b/i;

  // The fragment, but only when it will actually read as one. Better to say
  // less than to say it wrong — these go to real people on the first click.
  function loopUsable(r){
    const t=loopPhrase(r);
    if(!t)return "";
    const first=(t.split(/\s+/)[0]||"");
    if(/^[a-z]/.test(t))return t;          // lowercase — exactly what the hint asks for
    if(LOOP_HEADINGS.test(first))return ""; // reads like a status label
    if(/ing$/i.test(first))return "";       // "Waiting…", "Getting…", "Sorting…"
    return t;                               // a proper noun is fine: "Renogy's kit rate"
  }

  function itemsFor(r,i){
    const out=[], name=displayName(r), first=firstName(r), loop=loopUsable(r);
    const fu=daysUntil(r.follow_up_on);
    const since=daysSince(r.last_contacted);

    // 1. a specific follow-up with a date on it
    if(fu!==null&&fu<=0){
      const late=-fu, mine=(r.ball_is_with==="Me"), theirs=(r.ball_is_with==="Them");
      let line, sub;
      if(theirs){
        line=name+" still hasn't come back to you"+(loop?" about "+loop:"")+".";
        sub=since!==null?("You asked "+agoWords(since)+"."):(late>0?("Was due "+spanWords(late)+" ago."):"Due today.");
      }else if(mine){
        line=loop?("You still owe "+name+" an answer about "+loop+"."):("You said you'd get back to "+name+".");
        sub=late>0?("That was "+spanWords(late)+" ago."):"That's today.";
      }else{
        line=loop?("Time to get back to "+name+" about "+loop+"."):("Time to check in with "+name+".");
        sub=late>0?("Due "+spanWords(late)+" ago."):"Due today.";
      }
      out.push({r:r,i:i,kind:"followup",line:line,sub:sub,late:late>0,sev:10+late,
                btn:(theirs?"Chased them":"I got back to them")});
    }else if(fu!==null&&fu<=7){
      out.push({r:r,i:i,kind:"followup",line:(loop?("Get back to "+name+" about "+loop+"."):("Check in with "+name+".")),
                sub:"Coming up in "+spanWords(fu)+".",late:false,sev:9-fu,
                btn:"Done — handled it"});
    }

    // 2. birthday coming up
    const b=birthdayInfo(r.birthday);
    if(b&&b.daysAway<=30&&String(r.bday_done||"")!==String(new Date().getFullYear()+(b.daysAway>200?1:0))){
      const age=b.age!=null?(" They turn "+b.age+"."):"";
      let line,sub;
      if(b.daysAway===0){line="It's "+first+"'s birthday today.";sub="Send it now."+age;}
      else if(b.daysAway===1){line=first+"'s birthday is tomorrow.";sub="Last chance to get something out."+age;}
      else{line=first+"'s birthday is in "+b.daysAway+" days.";
           sub=(b.daysAway<=21?"Time to get a card made and sent.":"Worth putting on the list.")+age;}
      out.push({r:r,i:i,kind:"birthday",line:line,sub:sub,late:b.daysAway===0,
                sev:b.daysAway<=1?30:(16-b.daysAway),btn:"Sorted"});
    }

    // 2b. anniversary — any date worth marking, comes round every year like a birthday
    const a=anniversaryInfo(r);
    if(a&&a.daysAway<=21&&String(r.anniv_done||"")!==String(a.markYear)){
      const lab=(String(r.anniversary_label||"").trim()||"anniversary").replace(/[.!?]+$/,"");
      const yrs=a.years!=null?(" That's "+a.years+" year"+(a.years===1?"":"s")+"."):" Worth marking.";
      out.push({r:r,i:i,kind:"anniversary",
        line:(a.daysAway===0?("It's "+name+"'s "+lab+" today.")
                            :(name+"'s "+lab+" is in "+a.daysAway+" days.")),
        sub:yrs.trim(),late:false,sev:a.daysAway===0?24:(12-a.daysAway),btn:"Marked"});
    }

    // 3. drift — no task, just time. Suppressed while a follow-up is already scheduled.
    // A scheduled follow-up owns this person — overdue included. Otherwise an
    // overdue follow-up ALSO raises a drift card and one person fills two slots.
    if(since!==null&&(fu===null||!r.follow_up_on)){
      const limit=nudgeFor(r);
      if(since>=limit){
        // generic wording, their name dropped in — no pronouns, so it reads right for anybody
        const c=chan(r);
        const act=isPersonal(r)?c.personal(first):c.business(name);
        out.push({r:r,i:i,kind:"drift",
          line:"You haven't spoken to "+name+" in "+spanWords(since)+".",
          sub:act,late:false,sev:(since-limit)/3,btn:c.btn});
      }
    }
    return out;
  }

  // the most pressing reason this person is on the page — used to draft from the rolodex
  function topItemFor(r,i){
    const list=itemsFor(r,i);
    if(!list.length)return null;
    return list.slice().sort((a,b)=>b.sev-a.sev)[0];
  }

  function allItems(){
    const out=[];
    data.forEach((r,i)=>{
      // snoozed? then this person says nothing until the snooze runs out
      const sn=daysUntil(r.snooze_until);
      if(sn!==null&&sn>0)return;
      itemsFor(r,i).forEach(it=>out.push(it));
    });
    return out.sort((a,b)=>b.sev-a.sev);
  }

  /* ==========================================================================
     RENDER — zones
     ========================================================================== */
  const EMPTY={
    Personal:{b:"Nobody's waiting on you.",s:"Everyone close has had a hello lately."},
    Business:{b:"Nothing outstanding.",s:"No one owes you a reply and you don't owe one either."}
  };

  function renderZone(bucket){
    const el=document.getElementById("zone-"+bucket.toLowerCase());
    const items=allItems().filter(it=>((it.r.bucket||"Business")===bucket));
    let h='<div class="zhead"><h2>'+bucket+'</h2>'+
          (items.length?'<span class="zcount">'+items.length+' need'+(items.length===1?'s':'')+' you</span>':'')+
          '</div>';
    if(!items.length){
      h+='<div class="zempty"><b>'+EMPTY[bucket].b+'</b>'+EMPTY[bucket].s+'</div>';
    }else{
      items.forEach((it,n)=>{
        const cls="item"+(bucket==="Personal"?" personal":"")+(it.late?" late":"");
        h+='<div class="'+cls+'">'+avatar(it.r,"s")+
             '<div class="ibody">'+
               '<div class="iline">'+esc(it.line)+'</div>'+
               '<div class="isub'+(it.late?' late':'')+'">'+esc(it.sub)+
                 ((it.r.phone&&(it.r.channel==="Call"||it.r.channel==="Text"))
                   ?' <span class="inum">'+esc(it.r.phone)+'</span>':'')+'</div>'+
               '<div class="iact">'+
                 '<button class="idone" data-act="done" data-b="'+bucket+'" data-n="'+n+'">'+esc(it.btn)+'</button>'+
                 ((it.kind==="birthday"||it.kind==="anniversary")?'':
                   '<select data-sel="'+bucket+'-'+n+'">'+
                     '<option value="">then remind me…</option>'+
                     '<option value="3">in 3 days</option>'+
                     '<option value="7">in 1 week</option>'+
                     '<option value="14">in 2 weeks</option>'+
                     '<option value="30">in 1 month</option>'+
                     '<option value="90">in 3 months</option>'+
                   '</select>')+
                 reachBtn(it.r,it.i,bucket,n)+
                 '<button class="isnooze" data-act="snooze" data-i="'+it.i+'">Not today</button>'+
                 '<button class="iopen" data-act="open" data-i="'+it.i+'">'+esc(displayName(it.r))+'</button>'+
               '</div>'+
             '</div>'+
           '</div>';
      });
    }
    el.innerHTML=h;
    el._items=items;
  }

  // one action button, matching how he reaches this person — tel:/sms: work on the phone
  function reachBtn(r,i,bucket,n){
    const tel=String(r.phone||"").replace(/[^0-9+]/g,"");
    // where the draft comes from — so the email matches the reason on the card
    const ctx=' data-i="'+i+'" data-b="'+bucket+'" data-n="'+n+'"';
    if(r.channel==="Call"&&tel)
      return '<a class="imail" href="tel:'+esc(tel)+'">Call</a>';
    if(r.channel==="Text"&&tel)
      return '<a class="imail" href="sms:'+esc(tel)+'">Text</a>';
    if(r.email)
      return '<button class="imail" data-act="mail"'+ctx+'>&#9993; Email</button>'+
             '<button class="icopy" data-act="copy"'+ctx+' title="Copy the drafted email to the clipboard">Copy</button>';
    if(tel)
      return '<a class="imail" href="tel:'+esc(tel)+'">Call</a>';
    return "";
  }

  function zoneClick(e){
    const btn=e.target.closest("button");if(!btn)return;
    if(btn.dataset.act==="open"){openDetail(+btn.dataset.i);return;}
    if(btn.dataset.act==="mail"||btn.dataset.act==="copy"){
      const z=document.getElementById("zone-"+String(btn.dataset.b||"").toLowerCase());
      const it=(z&&z._items)?z._items[+btn.dataset.n]:null;
      const r=data[+btn.dataset.i];
      if(btn.dataset.act==="copy")copyDraft(r,it,btn); else emailContact(r,it);
      return;
    }
    if(btn.dataset.act==="snooze"){
      const r=data[+btn.dataset.i];r.snooze_until=addDaysISO(3);save();renderAll();return;
    }
    if(btn.dataset.act==="done"){
      const bucket=btn.dataset.b, n=+btn.dataset.n;
      const zone=document.getElementById("zone-"+bucket.toLowerCase());
      const it=(zone._items||[])[n];if(!it)return;
      const sel=zone.querySelector('[data-sel="'+bucket+'-'+n+'"]');
      const push=sel&&sel.value?parseInt(sel.value,10):null;
      markDone(it,push);
    }
  }
  document.getElementById("zone-personal").addEventListener("click",zoneClick);
  document.getElementById("zone-business").addEventListener("click",zoneClick);

  function markDone(it,pushDays){
    const r=data[it.i];
    const today=todayISO();
    if(!Array.isArray(r.history))r.history=[];
    r.snooze_until="";
    if(it.kind==="birthday"){
      const b=birthdayInfo(r.birthday);
      r.bday_done=String(new Date().getFullYear()+(b&&b.daysAway>200?1:0));
      r.history.unshift({d:today,n:"Birthday handled"});
    }else if(it.kind==="anniversary"){
      const a=anniversaryInfo(r);
      r.anniv_done=a?a.markYear:String(new Date().getFullYear());
      r.history.unshift({d:today,n:((r.anniversary_label||"Anniversary")+" marked")});
    }else{
      r.last_contacted=today;
      r.ball_is_with="Them";
      // log HOW he reached out, not just that he did
      const how=chan(r).log;
      r.history.unshift({d:today,n:(loopPhrase(r)?(how+" — "+loopPhrase(r)):how)});
      if(pushDays){ r.follow_up_on=addDaysISO(pushDays); }
      else { r.follow_up_on=""; r.open_loop=""; r.ball_is_with=""; }
    }
    if(r.history.length>50)r.history.length=50;
    save();renderAll();
  }

  /* ==========================================================================
     RENDER — rolodex
     ========================================================================== */
  const LETTERS="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

  /* ---- Rolodex filing, added 2026-08-29 ----------------------------------
     Dan's ask: he looks for "Roads Less Traveled", not "Emily". So the
     rolodex list and the A-Z rail file a contact under the BUSINESS name and
     show the person underneath. Nothing else changes: displayName() is still
     the person everywhere else, so email drafts, dialogs and the delete
     confirm all still say the human's name.

     NAME_IS_THE_BUSINESS = rows where the contact already IS the company and
     the company field holds a job description ("affiliate team", "via
     Impact"). Swapping those would file EcoFlow under A for "affiliate".
     Add a name here if another affiliate program gets added. Bluetti is
     deliberately NOT here: it is Snowning at Bluetti, so it files under B. */
  const NAME_IS_THE_BUSINESS=["ecoflow","jackery","renogy"];
  function fileUnder(r){
    const co=(r.company||"").trim();
    if(!co)return displayName(r);
    if(NAME_IS_THE_BUSINESS.indexOf(displayName(r).trim().toLowerCase())!==-1)return displayName(r);
    return co;
  }
  function fileUnderSub(r){
    const title=fileUnder(r), name=displayName(r);
    const sub=(title===name)?(r.company||"").trim():name;
    return (sub&&sub!==title)?sub:"";
  }

  function sortKey(r){return fileUnder(r).toUpperCase();}
  function letterOf(r){const c=sortKey(r)[0]||"#";return /[A-Z]/.test(c)?c:"#";}

  function matches(r){
    if(!query)return true;
    const q=query.toLowerCase();
    return cols.some(c=>{
      if(HIDDEN_COLS.includes(c))return false;
      return String(r[c]==null?"":r[c]).toLowerCase().includes(q);
    });
  }

  function renderRail(){
    const live=new Set(data.map(letterOf));
    let h='<button class="all'+(railLetter===""?" on":"")+'" data-l="">All</button>';
    LETTERS.forEach(L=>{
      const on=live.has(L);
      h+='<button class="'+(railLetter===L?"on":(on?"":"off"))+'" '+(on?'data-l="'+L+'"':'')+'>'+L+'</button>';
    });
    if(live.has("#"))h+='<button class="'+(railLetter==="#"?"on":"")+'" data-l="#">#</button>';
    const el=document.getElementById("rail");el.innerHTML=h;
  }
  document.getElementById("rail").addEventListener("click",e=>{
    const b=e.target.closest("button");if(!b||b.dataset.l===undefined)return;
    railLetter=(railLetter===b.dataset.l)?"":b.dataset.l;
    renderRail();renderList();
  });

  function renderList(){
    const el=document.getElementById("rlist");
    const rows=data.map((r,i)=>({r:r,i:i}))
      .filter(o=>matches(o.r))
      .filter(o=>!railLetter||letterOf(o.r)===railLetter)
      .sort((a,b)=>sortKey(a.r).localeCompare(sortKey(b.r),undefined,{numeric:true}));
    if(!rows.length){
      el.innerHTML='<div class="rnone">'+(query?'Nobody matches &ldquo;'+esc(query)+'&rdquo;.':'Nobody under that letter yet.')+'</div>';
      return;
    }
    el.innerHTML=rows.map(o=>{
      const r=o.r, since=daysSince(r.last_contacted);
      return '<div class="row" data-i="'+o.i+'">'+avatar(r,"m")+
        '<div><div class="rname">'+esc(fileUnder(r))+'</div>'+
        (fileUnderSub(r)?'<div class="rco">'+esc(fileUnderSub(r))+'</div>':'')+'</div>'+
        '<div class="rmeta"><span class="pill '+pillCls(r)+'">'+
          esc(groupWord(r))+'</span>'+
        '<div class="rwhen">'+(since===null?'not logged yet':('last spoke '+agoWords(since)))+'</div>'+
        '</div></div>';
    }).join("");
  }
  document.getElementById("rlist").addEventListener("click",e=>{
    const row=e.target.closest(".row");if(row)openDetail(+row.dataset.i);
  });
  function onSearch(v){query=v;renderList();}

  /* ==========================================================================
     DETAIL VIEW
     ========================================================================== */
  let detailIndex=null;
  function openDetail(i){
    detailIndex=i;const r=data[i];
    document.getElementById("dTitle").textContent="Contact";
    const b=birthdayInfo(r.birthday), since=daysSince(r.last_contacted), fu=daysUntil(r.follow_up_on);
    const extra=cols.filter(c=>!DEFAULT_COLS.includes(c)&&!LOOP_COLS.includes(c)&&r[c]);

    let h='<div class="dhead">'+avatar(r,"l")+
          '<div><div class="dname">'+esc(displayName(r))+'</div>'+
          (r.company?'<div class="dco">'+esc(r.company)+'</div>':'')+
          '<div style="margin-top:6px"><span class="pill '+pillCls(r)+'">'+

        '<option value="Me"'+(r.ball_is_with==="Me"?" selected":"")+'>Mine — I owe them</option>'+
        '<option value="Them"'+(r.ball_is_with==="Them"?" selected":"")+'>Theirs — I&rsquo;m waiting</option>'+
        '</select></div>'+
      '<div class="field"><label>Nudge me on</label><input id="lWhen" type="date" value="'+esc(r.follow_up_on||addDaysISO(7))+'"></div>';
    document.getElementById("ovLoop").classList.add("open");

  /* 2026-08-28 — a pushed nudge date used to be able to stand in for "handled".
     An email went out, the To-do date was moved forward, and the app removed the
     contact from the list having written NOTHING: blank last-spoke, empty history,
     ball still "Me", notes still reading "NOT SENT YET". A record that looks normal
     and says the opposite of what happened is worse than no record. So it asks. */
  function saveLoop(){
    const r=data[loopIndex];
    const text=document.getElementById("lText").value.trim();
    const ball=document.getElementById("lBall").value;
    const when=normDate(document.getElementById("lWhen").value);
    if(!loopAsked && ball==="Me" && when && when>todayISO()){
      loopAsked=true; askReachedOut(r); return;
    }
    commitLoop(r,text,ball,when);
  }

  function askReachedOut(r){
    const box=document.createElement("div");
    box.id="lAsk"; box.className="field";
    box.style.cssText="border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:4px";
    box.innerHTML='<div><strong>Before that saves \u2014 did you already reach out?</strong></div>'+
      '<div class="hint" style="margin-top:4px">You&rsquo;re pushing the nudge date forward while the ball is still yours, '+
      'which usually means something just went out. Say yes and it goes into '+esc(displayName(r))+'&rsquo;s history. '+
      'Say no and only the date changes.</div>'+
      '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">'+
        '<button class="btn primary" onclick="loopAnswer(true)">Yes \u2014 log it today</button>'+
        '<button class="btn" onclick="loopAnswer(false)">No \u2014 just the date</button>'+
      '</div>';
    document.getElementById("lBody").appendChild(box);
    box.scrollIntoView({block:"nearest"});
  }

  function loopAnswer(yes){
    loopLogSend=!!yes;
    const a=document.getElementById("lAsk"); if(a)a.remove();
    saveLoop();
  }

  function commitLoop(r,text,ball,when){
    if(loopLogSend){
      const today=todayISO();
      if(!Array.isArray(r.history))r.history=[];
      const how=chan(r).log;
      r.history.unshift({d:today,n:(text?(how+" \u2014 "+text):how)});
      if(r.history.length>50)r.history.length=50;
      r.last_contacted=today;
      ball="Them";
    }
    r.open_loop=text;
    r.ball_is_with=ball;
    r.follow_up_on=when;
    if(!r.last_contacted&&r.ball_is_with==="Them")r.last_contacted=todayISO();
    save();closeLoop();renderAll();
  }

  function downloadBackup(){
    const payload={app:"RV Solar Hub Relationship Manager",version:2,saved:todayISO(),
                   defaultNudge:defaultNudge(),schema:cols,contacts:data};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    const u=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=u;a.download="relationship-manager-backup-"+todayISO()+".json";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),2000);
    localStorage.setItem(BACKUP_KEY,todayISO());

  function restoreBackup(file){
    const fr=new FileReader();
    fr.onload=()=>{
      let p;
      try{p=JSON.parse(fr.result);}catch(e){alert("That file isn't a backup this app can read.");return;}
      const rows=Array.isArray(p)?p:p.contacts;
      if(!Array.isArray(rows)||!rows.length){alert("No contacts found in that file.");return;}
      if(!confirm("Restore "+rows.length+" contact"+(rows.length===1?"":"s")+
        " from this backup?\n\nThis REPLACES the "+data.length+" you have now. There is no undo."))return;
      data=rows;
      if(Array.isArray(p.schema)&&p.schema.length)cols=p.schema;
      if(p.defaultNudge)setDefaultNudge(p.defaultNudge);
      save();closeSettings();renderAll();
      alert("Restored "+rows.length+" contacts.");
    };
    fr.readAsText(file);
  }

  /* ==========================================================================
     PASTE AN EMAIL — the inbound half.
     Pulls out what it can prove. Anything it isn't sure of stays blank,
     because a wrong phone number sits there looking right until you need it.
     ========================================================================== */
  const FREE_MAIL=["gmail.com","googlemail.com","yahoo.com","yahoo.ca","hotmail.com","outlook.com",
    "live.com","msn.com","icloud.com","me.com","aol.com","proton.me","protonmail.com","gmx.com","sasktel.net"];
  const JUNK_LOCAL=/^(no-?reply|do-?not-?reply|donotreply|mailer-daemon|postmaster|bounce|notifications?|support|info|admin|hello|sales|team)$/i;
  // sign-offs sit exactly where a name sits, so they have to be ruled out by name
  const SIGN_OFFS=/^(best|best regards|regards|kind regards|warm regards|thanks|thank you|thanks again|cheers|sincerely|yours truly|all the best|talk soon|take care|many thanks|sent from my \w+)$/i;

  function parseEmailText(t){
    const found={email:"",first_name:"",last_name:"",company:"",phone:"",from:{}};
    const why={};
    t=String(t||"").replace(/ /g," ");

    // 1. address — the anchor. "From: Name <a@b.com>" is the most trustworthy shape.
    const fromLine=t.match(/^\s*From:\s*(.+)$/mi);
    let addr="";
    if(fromLine){
      const m=fromLine[1].match(/<\s*([^<>\s]+@[^<>\s]+)\s*>/);
      if(m)addr=m[1];
      const disp=fromLine[1].replace(/<[^>]*>/,"").replace(/["']/g,"").trim();
      if(disp&&disp.indexOf("@")<0&&disp.length<60){found.from.display=disp;}
    }
    if(!addr){
      const all=(t.match(/[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}/g)||[])
        .filter(a=>!JUNK_LOCAL.test(a.split("@")[0]));
      if(all.length)addr=all[0];
    }
    if(addr){found.email=addr.toLowerCase();why.email=fromLine?"from the From: line":"the first address in the text";}

    // 2. name — only from something that actually states it. Never invented.
    if(found.from.display){
      const parts=found.from.display.split(/\s+/).filter(Boolean);
      if(parts.length===1){found.first_name=parts[0];why.name="the From: line";}
      else if(parts.length<=4){found.first_name=parts[0];found.last_name=parts.slice(1).join(" ");why.name="the From: line";}
    }
    // 2b. no header? then the name is usually a plain line near the address in
    // the signature block. Only accept something that really looks like a name.
    if(!found.first_name&&found.email){
      const lines=t.split(/\r?\n/).map(s=>s.trim());
      const at=lines.findIndex(s=>s.toLowerCase().indexOf(found.email)>=0);
      if(at>=0){
        for(let k=Math.max(0,at-3);k<at;k++){
          const s=lines[k];
          if(!s||s.length>48)continue;
          if(/[@\d]/.test(s))continue;
          if(SIGN_OFFS.test(s))continue;
          const w=s.replace(/[,.]+$/,"").split(/\s+/);
          if(w.length<2||w.length>4)continue;
          if(!w.every(x=>/^[A-Z][a-zA-Z'’\-]+$/.test(x)))continue;
          found.first_name=w[0];found.last_name=w.slice(1).join(" ");why.name="the signature block";
          break;
        }
      }
    }
    if(!found.first_name&&found.email){
      // a local part like snowning or dan.castle is a fair read; anything with
      // digits or gibberish is not, and stays blank
      const lp=found.email.split("@")[0];
      if(/^[a-z]+([._-][a-z]+)?$/i.test(lp)){
        const bits=lp.split(/[._-]/).map(s=>s.charAt(0).toUpperCase()+s.slice(1));
        found.first_name=bits[0];if(bits[1])found.last_name=bits[1];
        why.name="guessed from the address — check it";
      }
    }

    // 3. company — the domain, unless it's a personal mailbox
    if(found.email){
      const dom=found.email.split("@")[1]||"";
      if(dom&&FREE_MAIL.indexOf(dom)<0){
        const root=dom.replace(/^(www|mail|email)\./,"").split(".")[0];
        if(root&&root.length>1){
          found.company=root.charAt(0).toUpperCase()+root.slice(1);why.company="the email domain";
          // if a line in the text spells that domain out properly, prefer it —
          // "Rootless Living Magazine" beats "Rootlessliving"
          const ls=t.split(/\r?\n/).map(s=>s.trim().replace(/[,.]+$/,""));
          for(let k=0;k<ls.length;k++){
            const s=ls[k];
            if(!s||s.length>48||/[@]/.test(s))continue;
            const squashed=s.replace(/[^a-z]/gi,"").toLowerCase();
            if(squashed.indexOf(root.toLowerCase())===0&&squashed.length>=root.length){
              found.company=s;why.company="spelled out in the signature";break;
            }
          }
        }
      }
    }

    // 4. phone — needs to look like a phone, not an order number or a date
    const cands=t.match(/(?:\+?\d[\d\s().\-]{8,}\d)/g)||[];
    for(let i=0;i<cands.length;i++){
      const raw=cands[i], digits=raw.replace(/\D/g,"");
      if(digits.length<10||digits.length>15)continue;
      if(/^\d{4}-\d{2}-\d{2}/.test(raw.trim()))continue;   // a date
      if(/(account|order|invoice|id|ref)\s*#?\s*$/i.test(t.slice(0,t.indexOf(raw)).slice(-14)))continue;
      found.phone=raw.trim();why.phone="a number in the text that looks like a phone";break;
    }
    return {found:found,why:why};
  }

  function findByEmail(addr){
    const a=String(addr||"").toLowerCase();
    if(!a)return -1;
    return data.findIndex(r=>String(r.email||"").toLowerCase()===a);
  }

  function openPaste(){
    document.getElementById("pTitle").textContent="Paste an email";
    document.getElementById("pBody").innerHTML=
      '<div class="field"><label>Paste the email — all of it, or just the signature</label>'+
      '<textarea id="pText" style="min-height:150px" placeholder="From: Snowning Li &lt;snowning@bluetti.com&gt;&#10;&#10;Hi Dan, thanks for your patience&hellip;"></textarea>'+
      '<div class="hint">Nothing is sent anywhere. It only reads what you paste and fills in what it can prove.</div></div>';
    const go=document.getElementById("pGo");
    go.textContent="Read it";go.onclick=runPaste;
    document.getElementById("ovPaste").classList.add("open");
    setTimeout(()=>{const e=document.getElementById("pText");if(e)e.focus();},60);
  }
  function closePaste(){document.getElementById("ovPaste").classList.remove("open");}

  function runPaste(){
    const txt=(document.getElementById("pText")||{}).value||"";
    if(!txt.trim()){alert("Paste something first.");return;}
    const res=parseEmailText(txt), f=res.found, why=res.why;
    if(!f.email){
      document.getElementById("pBody").innerHTML=
        '<div class="zempty"><b>No email address in there.</b>'+
        'Without an address there’s nothing to match on. Paste the header too, or add them by hand.</div>';
      const go=document.getElementById("pGo");go.textContent="Try again";go.onclick=openPaste;
      return;
    }
    const idx=findByEmail(f.email);
    if(idx>=0)showKnown(idx,f);else showNew(f,why);
  }

  // --- they're already in the book: this is a reply, not a new contact ---
  function showKnown(idx,f){
    const r=data[idx], its=itemsFor(r,idx);
    const loop=loopUsable(r);
    document.getElementById("pTitle").textContent="You already have "+displayName(r);
    document.getElementById("pBody").innerHTML=
      '<div class="dsec">That’s '+esc(displayName(r))+'</div>'+
      '<div class="dfact"><span class="k">Email</span><span>'+esc(f.email)+'</span></div>'+
      (r.last_contacted?'<div class="dfact"><span class="k">Last spoke</span><span>'+esc(fmtDate(r.last_contacted))+'</span></div>':'')+
      (loop?'<div class="dfact"><span class="k">Outstanding</span><span>'+esc(loop)+'</span></div>':'')+
      '<div class="hint" style="margin-top:10px">Heard back from them? Log it and the clock resets'+
      (loop?', and the outstanding item closes off into their history.':'.')+'</div>'+
      (its.length?'':'<div class="hint">Nothing is outstanding on them right now.</div>');
    const go=document.getElementById("pGo");
    go.textContent="Heard from them today";
    go.onclick=function(){logHeardFrom(idx);};
  }

  function logHeardFrom(idx){
    const r=data[idx], today=todayISO();
    if(!Array.isArray(r.history))r.history=[];
    const loop=loopPhrase(r);
    r.history.unshift({d:today,n:(loop?("Heard back — "+loop):"Heard back from them")});
    if(r.history.length>50)r.history.length=50;
    r.last_contacted=today;
    r.snooze_until="";
    r.open_loop="";r.ball_is_with="";r.follow_up_on="";
    save();closePaste();renderAll();
  }

  // --- nobody by that address: hand it to the Add form, already filled ---
  function showNew(f,why){
    document.getElementById("pTitle").textContent="Nobody here with that address";
    const row=(k,v,note)=>'<div class="dfact"><span class="k">'+k+'</span><span>'+
      (v?esc(v):'<span style="color:var(--soft)">not found — you’ll need to add this</span>')+
      (v&&note?' <span style="color:var(--soft);font-size:11.5px">('+esc(note)+')</span>':'')+'</span></div>';
    document.getElementById("pBody").innerHTML=
      '<div class="dsec">Here’s what it could read</div>'+
      row("First name",f.first_name,why.name)+
      row("Last name",f.last_name,why.name)+
      row("Company",f.company,why.company)+
      row("Email",f.email,why.email)+
      row("Phone",f.phone,why.phone)+
      '<div class="hint" style="margin-top:10px">Anything blank, it wasn’t sure enough to fill in. '+
      'Next screen is the normal Add form — nothing is saved until you press Save there.</div>';
    const go=document.getElementById("pGo");
    go.textContent="Fill in the form";
    go.onclick=function(){
      closePaste();
      openEdit(null);
      buildEditBody({bucket:"Business",first_name:f.first_name,last_name:f.last_name,
                     company:f.company,email:f.email,phone:f.phone,channel:"Email"});

  /* ==========================================================================
     EMAIL (compose-URL only — nothing is ever sent without Dan pressing send)
     ========================================================================== */
  function utf8b64(s){return btoa(unescape(encodeURIComponent(s)));}
  function b64url(s){return utf8b64(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");}
  function wrap76(b){return b.match(/.{1,76}/g).join("\r\n");}
  function encodeSubject(s){const b=utf8b64(s),pre="=?UTF-8?B?",suf="?=",ch=Math.floor((75-pre.length-suf.length)/4)*4,out=[];
    for(let i=0;i<b.length;i+=ch)out.push(pre+b.slice(i,i+ch)+suf);return out.join("\r\n ");}
  function buildRawEmail({to,from,subject,body}){
    const h=["To: "+to];if(from)h.push("From: "+from);
    h.push("Subject: "+encodeSubject(subject));h.push("MIME-Version: 1.0");
    h.push("Content-Type: text/plain; charset=UTF-8");h.push("Content-Transfer-Encoding: base64");
    return h.join("\r\n")+"\r\n\r\n"+wrap76(utf8b64(body))+"\r\n";
  }
  function sendEmail({to,subject,body}){
    const raw=buildRawEmail({to,subject,body});
    console.log("---- RFC 2822 message ----\r\n"+raw);
    if(SEND_ENDPOINT){
      return fetch(SEND_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({raw:b64url(raw)})})
        .then(r=>alert(r.ok?"Sent to "+to:"Send failed ("+r.status+")")).catch(()=>alert("Send failed — endpoint unreachable."));
    }
    const gmail="https://mail.google.com/mail/?view=cm&fs=1&to="+encodeURIComponent(to)+
      "&su="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body);
    const w=window.open(gmail,"_blank","noopener");
    if(!w)alert("Your browser blocked the pop-up. Allow pop-ups for this page and try again — it opens a ready-to-send Gmail draft.");
  }
  function myEmail(){let e=localStorage.getItem(EMAIL_KEY);if(!e){e="dancastle78@gmail.com";localStorage.setItem(EMAIL_KEY,e);}return e;}

  /* --------------------------------------------------------------------------
     THE DRAFT — the app already worked out why this person is on the page.
     It hands that over instead of dropping it at the door.
     Same fields the card sentence is built from. Templated, no AI. Dan edits
     and sends; nothing here goes anywhere on its own.
     -------------------------------------------------------------------------- */
  function signOff(r){return isPersonal(r)?"Dan":"Dan\r\nRV Solar Hub";}

  function draftFor(r,it){
    const first=firstName(r), loop=loopUsable(r);
    const since=daysSince(r.last_contacted);
    const kind=it?it.kind:"";
    let subject, body;

    if(kind==="birthday"){
      const b=birthdayInfo(r.birthday);
      subject="Happy birthday, "+first;
      body="Hi "+first+",\r\n\r\nHappy birthday. "+
           (b&&b.daysAway===0?"Hope you get a good day out of it.":"Hope it's a good one.")+
           "\r\n\r\n"+signOff(r);

    }else if(kind==="anniversary"){
      const a=anniversaryInfo(r);
      const lab=(String(r.anniversary_label||"").trim()||"anniversary").replace(/[.!?]+$/,"");
      subject=(isPersonal(r)?"Congratulations":"Congratulations on the "+lab);
      body="Hi "+first+",\r\n\r\nJust noticed the "+lab+" is coming up"+
           (a&&a.years!=null?" — "+a.years+" year"+(a.years===1?"":"s")+" now":"")+
           ". Worth marking.\r\n\r\n"+signOff(r);

    }else if(kind==="followup"&&r.ball_is_with==="Me"){
      subject=loop?("Getting back to you on "+loop):"Getting back to you";
      body="Hi "+first+",\r\n\r\nI owe you an answer"+(loop?" on "+loop:"")+
           " and I've been slower than I meant to be.\r\n\r\n\r\n\r\n"+signOff(r);

    }else if(kind==="followup"){
      subject=loop?("Following up on "+loop):"Following up";
      // only mention how long it's been once it's actually been a while —
      // "I asked yesterday" reads impatient to an affiliate manager
      const waited=(since!==null&&since>=7)?("I asked "+agoWords(since)+", so I"):"I";
      body="Hi "+first+",\r\n\r\nCircling back on "+(loop||"the last thing we spoke about")+". "+
           waited+" wanted to see where it stands.\r\n\r\n"+
           "No rush if it's still moving — just let me know either way.\r\n\r\n"+signOff(r);

    }else if(kind==="drift"&&isPersonal(r)){
      subject="Hello";
      body="Hi "+first+",\r\n\r\nIt's been "+(since!==null?spanWords(since):"a while")+
           " — too long. Just wanted to say hello and see how you're doing.\r\n\r\n"+signOff(r);

    }else if(kind==="drift"){
      subject="Checking in";
      body="Hi "+first+",\r\n\r\nIt's been "+(since!==null?spanWords(since):"a while")+
           " since we last spoke, so I thought I'd check in and see how things are going on your end.\r\n\r\n\r\n\r\n"+signOff(r);

    }else{
      subject=isPersonal(r)?"Hello":"Hello from RV Solar Hub";
      body="Hi "+first+",\r\n\r\n\r\n\r\n"+signOff(r);
    }
    return {to:r.email||myEmail(),subject:subject,body:body};
  }

  function emailContact(r,it){ sendEmail(draftFor(r,it)); }

  // Same draft, onto the clipboard — for when the Gmail window isn't where it's going.
  function copyDraft(r,it,btn){
    const d=draftFor(r,it);
    const txt="To: "+d.to+"\r\nSubject: "+d.subject+"\r\n\r\n"+d.body;
    const done=()=>{if(!btn)return;const o=btn.textContent;btn.textContent="Copied";setTimeout(()=>{btn.textContent=o;},1400);};
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt,done));
    }else fallbackCopy(txt,done);
  }
  function fallbackCopy(txt,done){
    const ta=document.createElement("textarea");
    ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");done();}catch(e){alert("Couldn't reach the clipboard. Use the Email button instead.");}
    ta.remove();
  }

  function handleCredential(resp){
